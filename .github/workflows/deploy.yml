name: Deploy to GitHub Pages

# Publishes the site to GitHub Pages on every push to main.
# The Configure Pages step below enables Pages with the "GitHub Actions"
# source automatically (enablement: true), so no manual repo setting is
# needed. After the first successful run the site is served at
# https://marlithaw.github.io/lunch/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source = GitHub Actions) automatically on first run,
          # so no manual Settings -> Pages toggle is required.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root; index.html is served at the site root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
